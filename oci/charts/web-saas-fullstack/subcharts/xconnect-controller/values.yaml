enabled: false
global:
  imagePullSecrets: []
  podLabels: {}
podAnnotations: {}
podSecurityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}
volumes: []
networkPolicy:
  enabled: true
workload:
  image: ''
  port: 8080
  replicas: 1
  env:
    GOMEMLIMIT: "200MiB"
    XCONNECT_SCHEMA_MANAGED: "true"
    XCONNECT_OVERLAY_REQUIRE_SIGNING_KEY: "true"
  secretRefs: [accounts-db-runtime, web-saas-secrets]
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  probes:
    startupProbe:
      httpGet:
        path: /healthz
        port: primary
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 12
    readinessProbe:
      httpGet:
        path: /readyz
        port: primary
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    livenessProbe:
      httpGet:
        path: /healthz
        port: primary
      initialDelaySeconds: 15
      periodSeconds: 15
      timeoutSeconds: 3
      failureThreshold: 3
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

# Workload autoscaling (helpers: templates/_autoscaling.tpl, canonical in
# oci/charts/library/workload-autoscaling). VPA renders only where the VPA API exists.
# HPA: per-workload `workload.autoscaling` (disabled by default); the VPA yields to it.
vpa:
  enabled: false
  updateMode: InPlaceOrRecreate
  minReplicas: 1
  controlledValues: RequestsAndLimits
  minAllowed:
    cpu: 10m
    memory: 32Mi
  maxAllowed:
    cpu: "1"
    memory: 1Gi
