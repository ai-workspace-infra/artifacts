enabled: false
global:
  imagePullSecrets: []
  podLabels: {}
podAnnotations: {}
podSecurityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}
volumes: []
networkPolicy:
  enabled: true
image: ''
metrics:
  prometheus:
    enabled: false
frontendService: frontend-router
gatewayEnabled: false
externalBackends:
  enabled: false
  accounts: ''
  billing: ''
  frontend: ''
httpOnly: false
replicas: 1
service:
  type: LoadBalancer
routes:
  consoleHost: ''
  consoleAliases: []
  accountsHost: ''
  accountsAliases: []
  billingHost: ''
  billingAliases: []
tls:
  consoleSecret: ''
  accountsSecret: ''
  billingSecret: ''
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

additionalHosts: []

# Workload autoscaling (helpers: templates/_autoscaling.tpl, canonical in
# oci/charts/library/workload-autoscaling). VPA renders only where the VPA API exists.
# HPA: per-workload `workload.autoscaling` (disabled by default); the VPA yields to it.
vpa:
  enabled: true
  updateMode: InPlaceOrRecreate
  minReplicas: 1
  controlledValues: RequestsAndLimits
  minAllowed:
    cpu: 10m
    memory: 32Mi
  maxAllowed:
    cpu: "1"
    memory: 1Gi
