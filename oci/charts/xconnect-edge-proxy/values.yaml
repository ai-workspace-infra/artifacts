# Default values for xconnect-edge-proxy.
# Ultra-lightweight Edge Ingress & Proxy Pod designed for 1C1G / 2C2G VPS nodes.
# Architecture: K3s (SQLite) -> ServiceLB (:80/:443) -> LoadBalancer Service -> 1 Pod Deployment.
# No Traefik, No FluxCD, No Ingress Controller required.

replicaCount: 1

# Node & Topology Configuration
global:
  nodeDomain: "jp-xconnect-01.svc.plus"
  entryPoint: "jp-xconnect-01.svc.plus"
  region: "JP"
  pool: "jp-main"
  teamId: ""
  resourceClass: "plus"
  customEmails: []

# Ingress Engine Selection
# Options: fluxgate (default) | haproxy | caddy
# - fluxgate: Rust + Pingora engine (~25MB RSS, zero-GC, ultra low latency, native 499 suppression) [DEFAULT for 1C1G]
# - haproxy: HAProxy 3.0-alpine (C epoll, single-process, ~79MB RSS)
# - caddy: Caddy 2.8-alpine (Go runtime, ~225MB RSS, recommended for >=2C2G)
ingress:
  provider: "fluxgate" # fluxgate | haproxy | caddy
  hostNetwork: false # false for K3s ServiceLB (LoadBalancer Service binds node 80/443 directly)
  httpPort: 80
  httpsPort: 443
  aliases: [] # Alternative hostnames / CNAMEs (e.g. ["xconnect-jp-free-01.svc.plus", "jp-free-selfhost-prod-v2.svc.plus"])
  tls:
    secretName: "xconnect-tls-secret"
    mountPath: "/etc/ssl/certs/xconnect"
    certFileName: "tls.crt"
    keyFileName: "tls.key"

# Service Configuration (Direct K3s ServiceLB Binding)
service:
  type: LoadBalancer # Binds directly to host :80 and :443 via K3s ServiceLB (klipper-lb)
  externalTrafficPolicy: Local # Preserves real client IP, avoids cross-node hops
  httpPort: 80
  httpsPort: 443
  annotations: {}

# Inter-Process Communication (UDS over shared RAM)
ipc:
  shmSizeLimit: "32Mi" # Memory emptyDir size limit for /dev/shm sockets

# Engines Specific Configurations (Tuned for 1C1G / 2C2G)
engines:
  fluxgate:
    image:
      repository: ghcr.io/ai-workspace-xstream/fluxgate
      tag: "0.1.0"
      pullPolicy: IfNotPresent
    metricsPort: 9102
    suppressH2Cancel499: true
    workerThreads: 1 # 1 worker thread is ideal for 1 vCPU; use 2 for 2 vCPU
    resources:
      limits:
        cpu: "500m"
        memory: "64Mi" # Hard ceiling (actual RSS ~25MB)
      requests:
        cpu: "20m"
        memory: "20Mi"

  haproxy:
    image:
      repository: haproxy
      tag: "3.0-alpine"
      pullPolicy: IfNotPresent
    metricsPort: 8404
    maxconn: 5000
    resources:
      limits:
        cpu: "500m"
        memory: "128Mi"
      requests:
        cpu: "30m"
        memory: "64Mi"

  caddy:
    image:
      repository: caddy
      tag: "2.8-alpine"
      pullPolicy: IfNotPresent
    metricsPort: 2019
    resources:
      limits:
        cpu: "1000m"
        memory: "384Mi"
      requests:
        cpu: "50m"
        memory: "128Mi"

# Edge Controller Agent (xconnect-edge-agent)
agent:
  enabled: true
  image:
    repository: ghcr.io/ai-workspace-xstream/xconnect-edge-agent
    tag: "latest"
    pullPolicy: IfNotPresent
  syncInterval: "60s"
  stateDir: "/var/lib/xconnect-edge-agent"
  gomemlimit: "48MiB" # Go runtime memory target to prevent heap bloating on 1C1G
  gogc: "50"
  resources:
    limits:
      cpu: "300m"
      memory: "64Mi"
    requests:
      cpu: "10m"
      memory: "20Mi"

# Core Network Service (Xray Backend over UDS)
core:
  enabled: true
  image:
    repository: ghcr.io/xtls/xray-core
    tag: "26.2.6"
    pullPolicy: IfNotPresent
  udsSocketPath: "/dev/shm/xray.sock"
  tcpSocketPath: "/dev/shm/xray-tcp.sock"
  gomemlimit: "64MiB"
  gogc: "50"
  resources:
    limits:
      cpu: "800m"
      memory: "128Mi"
    requests:
      cpu: "20m"
      memory: "32Mi"

# Observability Plane (Vector & Exporters)
observability:
  enabled: true
  vector:
    enabled: true
    image:
      repository: timberio/vector
      tag: "0.41.0-alpine"
      pullPolicy: IfNotPresent
    sinkUrl: "http://observability-server.svc.plus:8428"
    metricsPort: 8686
    resources:
      limits:
        cpu: "200m"
        memory: "48Mi"
      requests:
        cpu: "10m"
        memory: "16Mi"
  exporters:
    enabled: true
    xhttpPort: 9100
    tcpPort: 9101

# Credentials & Security Plane (Zero-leak contract)
security:
  existingSecret: ""
  authUrl: "https://accounts.svc.plus"
  billingServiceUrl: "https://billing.svc.plus"
  vaultEnvPath: "prod"
  vaultAddr: "https://vault.svc.plus"
  vaultTlsSecretPath: "kv/data/CICD/domains/svc.plus"
  observabilityVaultPath: "kv/data/CICD/observability"
  vaultToken: ""
  internalServiceToken: ""

# Periodic Drift Convergence & Sync (Optional CronJob)
syncTimer:
  enabled: false # On standalone 1C1G, disable in-cluster cron to save memory; use host timer or manual GitOps
  schedule: "*/15 * * * *"
  image:
    repository: alpine/git
    tag: "latest"
    pullPolicy: IfNotPresent
  playbooksRepo: "https://github.com/ai-workspace-infra/playbooks.git"
  gitopsRepo: "https://github.com/ai-workspace-infra/gitops.git"
  branch: "main"

# Standard Kubernetes Metadata
serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext:
  fsGroup: 0

securityContext:
  privileged: false
  capabilities:
    add:
      - NET_ADMIN
      - NET_BIND_SERVICE
  runAsUser: 0
  runAsGroup: 0

nodeSelector: {}
tolerations: []
affinity: {}
