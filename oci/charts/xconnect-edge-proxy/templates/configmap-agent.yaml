apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "xconnect-edge-proxy.fullname" . }}-agent-config
  labels:
    {{- include "xconnect-edge-proxy.labels" . | nindent 4 }}
data:
  account-agent.yaml: |
    mode: "agent"

    log:
      level: info

    agent:
      id: {{ .Values.global.nodeDomain | quote }}
      role: "agent-proxy"
      resourceClass: {{ .Values.global.resourceClass | default "plus" | quote }}
      teamId: {{ .Values.global.teamId | default "" | quote }}
      entryPoint: {{ .Values.global.entryPoint | default .Values.global.nodeDomain | quote }}
      pool: {{ .Values.global.pool | default "jp-main" | quote }}
      region: {{ .Values.global.region | default "JP" | quote }}
      controllerUrl: {{ .Values.security.authUrl | quote }}
      apiToken: {{ .Values.security.internalServiceToken | default "6cf595b2e5f3e560d41d5e4ab67fbbd40f886d03bf7a77e1fc1cb440d76e9823" | quote }}
      httpTimeout: 15s
      statusInterval: 1m
      syncInterval: 10m
      tls:
        insecureSkipVerify: false

    billing:
      enabled: false
      baseURL: {{ .Values.security.billingServiceUrl | quote }}
      httpTimeout: 15s
      collectInterval: 1m
      reconcileInterval: 5m

    xray:
      sync:
        enabled: true
        interval: 10m
        targets:
          - name: "xhttp"
            outputPath: "/usr/local/etc/xray/config.json"
            templatePath: "/etc/agent/xray.xhttp.template.json"
            restartCommand: ["pkill", "-f", "xray run"]

  xray.xhttp.template.json: |
    {
      "log": {
        "loglevel": "warning"
      },
      "api": {
        "tag": "api",
        "listen": "127.0.0.1:10086",
        "services": ["HandlerService", "StatsService"]
      },
      "inbounds": [
        {
          "tag": "xhttp-vless",
          "listen": "{{ .Values.core.udsSocketPath }},0666",
          "protocol": "vless",
          "settings": {
            "clients": [],
            "decryption": "none"
          },
          "streamSettings": {
            "network": "xhttp",
            "xhttpSettings": {
              "mode": "auto",
              "path": "/split"
            }
          }
        }
      ],
      "outbounds": [
        {
          "tag": "direct",
          "protocol": "freedom",
          "settings": {}
        },
        {
          "tag": "blocked",
          "protocol": "blackhole",
          "settings": {}
        }
      ],
      "routing": {
        "domainStrategy": "AsIs",
        "rules": [
          {
            "type": "field",
            "ip": [
              "geoip:private"
            ],
            "outboundTag": "blocked"
          }
        ]
      },
      "policy": {
        "levels": {
          "0": {
            "statsUserUplink": true,
            "statsUserDownlink": true,
            "bufferSize": 512
          }
        }
      },
      "stats": {}
    }
