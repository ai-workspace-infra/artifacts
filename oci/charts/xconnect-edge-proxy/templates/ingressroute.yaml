{{- if eq .Values.ingress.provider "traefik" -}}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "xconnect-edge-proxy.fullname" . }}
  labels:
    {{- include "xconnect-edge-proxy.labels" . | nindent 4 }}
    {{- with .Values.engines.traefik.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.engines.traefik.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  entryPoints:
    {{- toYaml .Values.engines.traefik.entryPoints | nindent 4 }}
  routes:
    - kind: Rule
      match: Host(`{{ .Values.global.nodeDomain }}`)
      services:
        - name: {{ include "xconnect-edge-proxy.fullname" . }}
          port: {{ .Values.service.httpsPort | default 443 }}
          scheme: {{ .Values.engines.traefik.scheme | default "h2c" }}
          passHostHeader: true
          responseForwarding:
            flushInterval: {{ .Values.engines.traefik.flushInterval | default "-1ms" }}
  {{- if .Values.ingress.tls.secretName }}
  tls:
    secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
{{- end }}
