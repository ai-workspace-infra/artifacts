{{- if and (not .Values.security.existingSecret) (or .Values.security.vaultToken .Values.security.internalServiceToken) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "xconnect-edge-proxy.fullname" . }}-credentials
  labels:
    {{- include "xconnect-edge-proxy.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.security.vaultToken }}
  VAULT_TOKEN: {{ .Values.security.vaultToken | quote }}
  {{- end }}
  {{- if .Values.security.internalServiceToken }}
  INTERNAL_SERVICE_TOKEN: {{ .Values.security.internalServiceToken | quote }}
  {{- end }}
{{- end }}
