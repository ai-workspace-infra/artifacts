# Global configurations shared across all subcharts
global:
  domain: "open-platform.local"
  storageClass: ""
  imagePullPolicy: "IfNotPresent"
  # One bearer token shared by every MCP server (grafana-mcp-server, ssh/victoria* MCP servers)
  # and the MCP gateway: a Secret in the release namespace and its key. On by default so no MCP
  # endpoint is served without auth; rendering fails if it is on and no Secret is named.
  mcp:
    bearerToken:
      enabled: true
      existingSecret: platform-mcp
      key: mcp-service-token

# 01 Git & CI/CD Engine
gitea:
  enabled: true

# 02 Cloud-Native Artifact Registry
harbor:
  enabled: true

# 03 S3-Compatible Object Storage
silo:
  enabled: true

# 04 Dynamic Inventory & CMDB Service
cmdb:
  enabled: true

# 05 Full-Stack Observability & Telemetry Central Stack
# Grafana as its own release (charts/grafana), on by default; the Grafana bundled in
# observability-stack is turned off below so only one Grafana runs.
# grafana.mcp.enabled adds the optional read-only mcp-grafana Deployment/Service.
grafana:
  enabled: true
  rootUrl: ""
  # Empty: "<release>-observability-stack", the observability-stack subchart of this release.
  backendFullname: ""
  mcp:
    enabled: false

observability-stack:
  enabled: true
  domain: "open-platform.local"
  grafana:
    enabled: false

# 05 Host & Node Telemetry Agent
observability-agent:
  enabled: true

# 06 Secret Engine & IAM Backend
vault-zitadel:
  enabled: true
  vault:
    apiAddr: ""

# 08 Cloud-Neutral Container & Vector DB
pgvector:
  enabled: true

# 09 Database Backup & Restore Sandbox
pg-backup:
  enabled: true

# 10 Dual-Tier AI Gateway (New API + LiteLLM)
ai-gateway:
  enabled: true

# 11 Infrastructure MCP Tool Gateway
mcp-gateway:
  enabled: true

# Caddy (moved from the former infra-platform group; scaffold image, off by default)
caddy:
  enabled: false
