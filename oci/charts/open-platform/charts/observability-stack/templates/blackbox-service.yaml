{{- if .Values.blackboxExporter.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "observability-stack.fullname" . }}-blackbox
  labels:
    helm.sh/chart: {{ include "observability-stack.name" . }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/name: blackbox-exporter
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.blackboxExporter.port }}
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: blackbox-exporter
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
