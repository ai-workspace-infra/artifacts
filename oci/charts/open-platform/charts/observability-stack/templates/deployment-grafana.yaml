apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "observability-stack.fullname" . }}-grafana
  labels:
    {{- include "observability-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if .Values.persistence.enabled }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "observability-stack.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: grafana
  template:
    metadata:
      annotations:
        checksum/grafana-bundle: {{ .Values.grafana.bundleChecksum | quote }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "observability-stack.labels" . | nindent 8 }}
        app.kubernetes.io/component: grafana
    spec:
      serviceAccountName: {{ .Values.serviceAccountName | quote }}
      {{- if .Values.grafana.pluginArchives }}
      initContainers:
        - name: verified-grafana-plugins
          image: {{ .Values.grafana.pluginInstallerImage | quote }}
          command: [python3, /installer/install-plugins.py]
          env:
            - name: PLUGIN_ARCHIVES
              value: {{ .Values.grafana.pluginArchives | toJson | quote }}
          securityContext:
            runAsUser: 472
            runAsGroup: 472
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
{{ toYaml .Values.grafana.pluginInstallerResources | nindent 12 }}
          volumeMounts:
            - name: grafana-plugins
              mountPath: /plugins
            - name: grafana-plugin-installer
              mountPath: /installer
              readOnly: true
      {{- end }}
      containers:
        - name: grafana
          image: "{{ .Values.grafana.image.repository }}:{{ .Values.grafana.image.tag }}"
          imagePullPolicy: {{ .Values.grafana.image.pullPolicy }}
          env:
            {{- if .Values.grafana.pluginArchives }}
            - name: GF_PATHS_PLUGINS
              value: /opt/grafana/plugins
            {{- end }}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "grafana.existingSecret is required" .Values.grafana.existingSecret | quote }}
                  key: {{ .Values.grafana.adminPasswordKey | quote }}
            - name: GF_SERVER_ROOT_URL
              value: {{ .Values.grafana.rootUrl | default (printf "http://grafana.%s:3000/" ((and .Values.global .Values.global.domain) | default .Values.domain | default "open-platform.local")) | quote }}
            {{- if .Values.grafana.plugins }}
            - name: GF_PLUGINS_PREINSTALL_SYNC
              value: {{ join "," .Values.grafana.plugins | quote }}
            {{- end }}
            {{- if .Values.grafana.unsignedPlugins }}
            - name: GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS
              value: {{ join "," .Values.grafana.unsignedPlugins | quote }}
            {{- end }}
          {{- if .Values.grafana.runtimeSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.grafana.runtimeSecret | quote }}
          {{- end }}
          ports:
            - name: grafana
              containerPort: 3000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /api/health
              port: grafana
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/health
              port: grafana
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /api/health
              port: grafana
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
{{ toYaml .Values.grafana.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
              subPath: grafana
            {{- if .Values.grafana.pluginArchives }}
            - name: grafana-plugins
              mountPath: /opt/grafana/plugins
            {{- end }}
            - name: {{ if .Values.grafana.datasourcesConfigMap }}grafana-datasources{{ else }}config{{ end }}
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml

            {{- if .Values.grafana.appsConfigMap }}
            - name: grafana-apps
              mountPath: /etc/grafana/provisioning/plugins/apps.yaml
              subPath: apps.yaml
              readOnly: true
            {{- end }}
            {{- range $i, $provider := .Values.grafana.dashboardProviders }}
            - name: grafana-provider-{{ $i }}
              mountPath: /etc/grafana/imported-dashboards/{{ $provider.path }}
              readOnly: true
            {{- end }}
            {{- if or .Values.grafana.dashboardsConfigMap .Values.grafana.dashboardProviders }}
            - name: config
              mountPath: /etc/grafana/provisioning/dashboards/platform.yaml
              subPath: dashboards.yaml
            {{- end }}
            {{- if .Values.grafana.dashboardsConfigMap }}
            - name: dashboards
              mountPath: /etc/grafana/platform-dashboards
              readOnly: true
            {{- end }}

      volumes:
        {{- if .Values.grafana.pluginArchives }}
        - name: grafana-plugins
          emptyDir: {}
        - name: grafana-plugin-installer
          configMap:
            name: {{ include "observability-stack.fullname" . }}-plugin-installer
        {{- end }}
        {{- if .Values.grafana.datasourcesConfigMap }}
        - name: grafana-datasources
          configMap:
            name: {{ .Values.grafana.datasourcesConfigMap | quote }}
        {{- end }}
        {{- if .Values.grafana.appsConfigMap }}
        - name: grafana-apps
          configMap:
            name: {{ .Values.grafana.appsConfigMap | quote }}
        {{- end }}
        {{- range $i, $provider := .Values.grafana.dashboardProviders }}
        - name: grafana-provider-{{ $i }}
          projected:
            sources:
              {{- range $provider.configMaps }}
              - configMap:
                  name: {{ . | quote }}
              {{- end }}
        {{- end }}
        {{- if .Values.grafana.dashboardsConfigMap }}
        - name: dashboards
          configMap:
            name: {{ .Values.grafana.dashboardsConfigMap }}
        {{- end }}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "observability-stack.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: config
          configMap:
            name: {{ include "observability-stack.fullname" . }}-config
