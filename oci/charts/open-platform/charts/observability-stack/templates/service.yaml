{{- if .Values.grafana.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "observability-stack.fullname" . }}-grafana
  labels:
    {{- include "observability-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: grafana
      port: {{ .Values.service.grafanaPort }}
      targetPort: grafana
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "observability-stack.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: grafana
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "observability-stack.fullname" . }}
  labels:
    {{- include "observability-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: grafana
      port: {{ .Values.service.grafanaPort }}
      targetPort: grafana
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "observability-stack.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: grafana
---
{{- end }}
