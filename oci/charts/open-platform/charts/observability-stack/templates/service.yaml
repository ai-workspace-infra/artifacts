apiVersion: v1
kind: Service
metadata:
  name: {{ include "observability-stack.fullname" . }}-otel-collector
  labels:
    {{- include "observability-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: otlp-http
      port: {{ .Values.service.otlpHttpPort }}
      targetPort: otlp-http
      protocol: TCP
    - name: otlp-grpc
      port: {{ .Values.service.otlpGrpcPort }}
      targetPort: otlp-grpc
      protocol: TCP
    - name: metrics
      port: 8889
      targetPort: metrics
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "observability-stack.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: otel-collector
