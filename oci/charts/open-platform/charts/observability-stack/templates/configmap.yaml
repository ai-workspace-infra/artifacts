apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "observability-stack.fullname" . }}-config
  labels:
    {{- include "observability-stack.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'victoriametrics'
        static_configs:
          - targets: ['127.0.0.1:8428', '127.0.0.1:9428', '127.0.0.1:10428', '127.0.0.1:8888', '127.0.0.1:8889']
            labels:
              cluster: {{ .Values.telemetry.cluster | default .Release.Name | quote }}
              environment: {{ .Values.telemetry.environment | quote }}
    {{- with .Values.telemetry.extraScrapeConfigs }}
    {{- toYaml . | nindent 6 }}
    {{- end }}
  otel-collector.yml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    {{- if .Values.telemetry.kubernetes.enabled }}
      kubeletstats:
        collection_interval: 20s
        initial_delay: 1s
        auth_type: serviceAccount
        endpoint: https://${env:K8S_NODE_IP}:10250
        insecure_skip_verify: false
        metric_groups: [node, pod, container, volume]
    {{- end }}
    {{- if .Values.telemetry.spanMetrics }}
    connectors:
      spanmetrics:
        metrics_flush_interval: 15s
        dimensions:
          - name: http.method
          - name: http.route
          - name: http.status_code
        resource_metrics_key_attributes: [service.name, cluster, environment]
    {{- end }}
    processors:
      resource/cluster:
        attributes:
          - key: cluster
            value: {{ .Values.telemetry.cluster | default .Release.Name | quote }}
            action: upsert
          - key: environment
            value: {{ .Values.telemetry.environment | quote }}
            action: upsert
      batch: {}
    exporters:
      prometheus:
        endpoint: 0.0.0.0:8889
        resource_to_telemetry_conversion:
          enabled: true
      otlphttp/traces:
        traces_endpoint: http://127.0.0.1:10428/insert/opentelemetry/v1/traces
      otlphttp/logs:
        logs_endpoint: http://127.0.0.1:9428/insert/opentelemetry/v1/logs
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [resource/cluster, batch]
          exporters: [otlphttp/traces{{ if .Values.telemetry.spanMetrics }}, spanmetrics{{ end }}]
        metrics:
          receivers: [otlp{{ if .Values.telemetry.spanMetrics }}, spanmetrics{{ end }}{{ if .Values.telemetry.kubernetes.enabled }}, kubeletstats{{ end }}]
          processors: [resource/cluster, batch]
          exporters: [prometheus]
        logs:
          receivers: [otlp]
          processors: [resource/cluster, batch]
          exporters: [otlphttp/logs]
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: VictoriaMetrics
        type: prometheus
        access: proxy
        url: http://127.0.0.1:8428
        isDefault: true
      - name: VictoriaLogs
        type: victoriametrics-logs-datasource
        access: proxy
        url: http://127.0.0.1:9428
      - name: VictoriaTraces
        type: jaeger
        access: proxy
        url: http://127.0.0.1:10428/select/jaeger
