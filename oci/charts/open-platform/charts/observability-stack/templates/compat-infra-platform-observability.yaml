{{- if .Values.compat.infraPlatformScaffold.enabled }}
{{- $s := .Values.compat.infraPlatformScaffold }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "observability-stack.fullname" . }}-infra-scaffold
  labels:
    app: observability
spec:
  {{- include "workload-autoscaling.replicas" . | nindent 2 }}
  selector:
    matchLabels:
      app: observability
  template:
    metadata:
      labels:
        app: observability
    spec:
      containers:
        - name: observability
          image: "{{ $s.image.repository }}:{{ $s.image.tag }}"
          imagePullPolicy: {{ $s.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $s.service.port }}
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "observability-stack.fullname" . }}-infra-scaffold
  labels:
    app: observability
spec:
  type: {{ $s.service.type }}
  ports:
    - port: {{ $s.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: observability
{{- end }}
