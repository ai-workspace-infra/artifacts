{{- if .Values.mcp.grafana.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.mcp.grafana.deploymentName | default (printf "%s-mcp-grafana" (include "observability-stack.fullname" .)) }}
  labels:
    {{- include "observability-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-grafana
spec:
  replicas: {{ .Values.mcp.grafana.replicas | default .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "observability-stack.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: mcp-grafana
  template:
    metadata:
      labels:
        {{- include "observability-stack.labels" . | nindent 8 }}
        app.kubernetes.io/component: mcp-grafana
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp-grafana
          {{- $grafanaImg := .Values.mcp.grafana.image.repository -}}
          {{- if .Values.mcp.grafana.image.tag -}}
            {{- $grafanaImg = printf "%s:%s" $grafanaImg .Values.mcp.grafana.image.tag -}}
          {{- end }}
          image: {{ $grafanaImg | quote }}
          imagePullPolicy: {{ .Values.mcp.grafana.image.pullPolicy }}
          args:
            - "--base-path"
            - {{ .Values.mcp.grafana.basePath | default "/v1/grafana" | quote }}
            {{- if .Values.mcp.grafana.disableWrite }}
            - "--disable-write"
            {{- end }}
            {{- if .Values.mcp.grafana.disableAdmin }}
            - "--disable-admin"
            {{- end }}
            - "--allowed-hosts"
            - {{ include "observability-stack.mcpGrafanaAllowedHosts" . | quote }}
          env:
            - name: GRAFANA_URL
              value: {{ .Values.mcp.grafana.grafanaUrl | default (printf "http://%s-grafana:%d/" (include "observability-stack.fullname" .) (int .Values.service.grafanaPort)) | quote }}
            - name: GRAFANA_SERVICE_ACCOUNT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mcp.grafana.tokenSecret.name | default "infra-mcp-auth" | quote }}
                  key: {{ .Values.mcp.grafana.tokenSecret.key | default "grafana-service-account-token" | quote }}
                  optional: {{ .Values.mcp.grafana.tokenSecret.optional | default true }}
          ports:
            - name: grafana-sse
              containerPort: {{ .Values.mcp.grafana.port | default 8000 }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.mcp.grafana.port | default 8000 }}
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.mcp.grafana.port | default 8000 }}
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.mcp.grafana.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
{{- end }}
{{- end }}
