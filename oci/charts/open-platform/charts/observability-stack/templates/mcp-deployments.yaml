{{- if .Values.mcp.enabled }}
{{- if .Values.mcp.victoriaMetrics.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.mcp.victoriaMetrics.deploymentName | default (printf "%s-mcp-victoriametrics" (include "observability-stack.fullname" .)) }}
  labels:
    {{- include "observability-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-victoriametrics
spec:
  replicas: {{ .Values.mcp.victoriaMetrics.replicas | default .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "observability-stack.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: mcp-victoriametrics
  template:
    metadata:
      labels:
        {{- include "observability-stack.labels" . | nindent 8 }}
        app.kubernetes.io/component: mcp-victoriametrics
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mcp-victoriametrics
          image: "{{ .Values.mcp.victoriaMetrics.image.repository }}:{{ .Values.mcp.victoriaMetrics.image.tag }}"
          imagePullPolicy: {{ .Values.mcp.victoriaMetrics.image.pullPolicy }}
          env:
            - name: VM_INSTANCE_ENTRYPOINT
              value: {{ .Values.mcp.victoriaMetrics.entrypoint | default (printf "http://%s-victoria-metrics:%d" (include "observability-stack.fullname" .) (int .Values.service.metricsPort)) | quote }}
            - name: VM_INSTANCE_TYPE
              value: {{ .Values.mcp.victoriaMetrics.instanceType | default "single" | quote }}
            - name: MCP_SERVER_MODE
              value: "http"
            - name: MCP_LISTEN_ADDR
              value: {{ printf "0.0.0.0:%d" (int (.Values.mcp.victoriaMetrics.port | default 8088)) | quote }}
          ports:
            - name: mcp
              containerPort: {{ .Values.mcp.victoriaMetrics.port | default 8088 }}
              protocol: TCP
          resources:
            {{- toYaml .Values.mcp.victoriaMetrics.resources | nindent 12 }}
---
{{- end }}
