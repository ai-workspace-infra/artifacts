replicaCount: 1
serviceAccountName: default
serviceAccount:
  create: false
rbac:
  create: true

domain: "open-platform.local"

victoriaMetrics:
  image:
    repository: victoriametrics/victoria-metrics
    tag: "v1.101.0"
    pullPolicy: IfNotPresent
  port: 8428
  retentionPeriod: "30d"

victoriaLogs:
  image:
    repository: victoriametrics/victoria-logs
    tag: "v1.52.0"
    pullPolicy: IfNotPresent
  port: 9428
  retentionPeriod: "1y"

victoriaTraces:
  image:
    repository: victoriametrics/victoria-traces
    tag: "v0.1.0"
    pullPolicy: IfNotPresent
  port: 10428
  otlpHttpPort: 4318
  otlpGrpcPort: 4317

otelCollector:
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.114.0"
    pullPolicy: IfNotPresent
  port: 4319

grafana:
  image:
    repository: grafana/grafana
    tag: "13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f"
    pullPolicy: IfNotPresent
  port: 3000
  existingSecret: grafana-admin
  adminPasswordKey: password
  rootUrl: ""
  plugins: []
  dashboardsConfigMap: ""
  datasourcesConfigMap: ""
  appsConfigMap: ""
  runtimeSecret: ""
  bundleChecksum: ""
  dashboardProviders: []
  unsignedPlugins: []
  pluginArchives: []
  pluginInstallerImage: python:3.14.0-alpine3.22@sha256:8373231e1e906ddfb457748bfc032c4c06ada8c759b7b62d9c73ec2a3c56e710

service:
  type: ClusterIP
  grafanaPort: 3000
  metricsPort: 8428
  logsPort: 9428
  tracesPort: 10428
  otlpHttpPort: 4318
  otlpGrpcPort: 4317
  otelCollectorPort: 4319

persistence:
  enabled: true
  size: 20Gi
  accessMode: ReadWriteOnce
  storageClass: ""

resources:
  limits:
    cpu: 2000m
    memory: 2048Mi
  requests:
    cpu: 200m
    memory: 512Mi

telemetry:
  spanMetrics: false
  cluster: ""
  environment: unspecified
  extraScrapeConfigs: []
  kubernetes:
    enabled: false
    # Exclude container when a canonical raw cAdvisor scrape owns container_* series.
    metricGroups: [node, pod, container, volume]
    kubeletInsecureSkipVerify: false
    clusterReceiver: true
    logs:
      enabled: true
      podsLogPath: /var/log/pods
    journald:
      enabled: false
      directory: /var/log/journal
      units:
        - k3s.service
        - k3s-agent.service
