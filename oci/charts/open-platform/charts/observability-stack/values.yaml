replicaCount: 1
serviceAccountName: default
serviceAccount:
  create: false
rbac:
  create: true

domain: "open-platform.local"

victoriaMetrics:
  image:
    repository: victoriametrics/victoria-metrics
    tag: "v1.101.0@sha256:91d0456cc064e195869175074ced2a6849d72531613b320492698e5fe935d10a"
    pullPolicy: IfNotPresent
  port: 8428
  retentionPeriod: "30d"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi

victoriaLogs:
  image:
    repository: victoriametrics/victoria-logs
    tag: "v1.52.0@sha256:47b820890d64c4575a2a0a46415dcd8a4fd59a0f1fcd6a377693d7aea639442e"
    pullPolicy: IfNotPresent
  port: 9428
  retentionPeriod: "1y"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi

victoriaTraces:
  image:
    repository: victoriametrics/victoria-traces
    tag: "v0.1.0@sha256:b3204fd598b023b4726f38689791c707803b9f34733822dd053f22d64721b3d2"
    pullPolicy: IfNotPresent
  port: 10428
  otlpHttpPort: 4318
  otlpGrpcPort: 4317
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 128Mi

otelCollector:
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.114.0@sha256:37fa87091cfaaec7234a27e4e395a40c31c2bfaea97a349a4afef6d9e9681197"
    pullPolicy: IfNotPresent
  port: 4319
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 192Mi

blackboxExporter:
  enabled: false
  image:
    repository: quay.io/prometheus/blackbox-exporter
    tag: v0.25.0
    pullPolicy: IfNotPresent
  port: 9115
  modules:
    http_2xx:
      prober: http
      timeout: 5s
      http:
        preferred_ip_protocol: ip4
        follow_redirects: true
    tcp_tls:
      prober: tcp
      timeout: 5s
      tcp:
        tls: true
        preferred_ip_protocol: ip4
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

grafana:
  image:
    repository: grafana/grafana
    tag: "13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f"
    pullPolicy: IfNotPresent
  port: 3000
  existingSecret: grafana-admin
  adminPasswordKey: password
  rootUrl: ""
  plugins: []
  dashboardsConfigMap: ""
  datasourcesConfigMap: ""
  appsConfigMap: ""
  runtimeSecret: ""
  bundleChecksum: ""
  dashboardProviders: []
  unsignedPlugins: []
  pluginArchives: []
  pluginInstallerImage: python:3.14.0-alpine3.22@sha256:8373231e1e906ddfb457748bfc032c4c06ada8c759b7b62d9c73ec2a3c56e710
  pluginInstallerResources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

service:
  type: ClusterIP
  grafanaPort: 3000
  metricsPort: 8428
  logsPort: 9428
  tracesPort: 10428
  otlpHttpPort: 4318
  otlpGrpcPort: 4317
  otelCollectorPort: 4319

persistence:
  enabled: true
  size: 20Gi
  accessMode: ReadWriteOnce
  storageClass: ""

telemetry:
  spanMetrics: false
  cluster: ""
  environment: unspecified
  extraScrapeConfigs: []
  kubernetes:
    enabled: false
    # Exclude container when a canonical raw cAdvisor scrape owns container_* series.
    metricGroups: [node, pod, container, volume]
    kubeletInsecureSkipVerify: false
    clusterReceiver: true
    logs:
      enabled: true
      podsLogPath: /var/log/pods
    journald:
      enabled: false
      directory: /var/log/journal
      units:
        - k3s.service
        - k3s-agent.service

# ------------------------------------------------------------------------------
# Model Context Protocol (MCP) Server Gateways
# Exposes MCP interfaces for VictoriaMetrics, VictoriaLogs, VictoriaTraces, and Grafana
# ------------------------------------------------------------------------------
mcp:
  enabled: false
  victoriaMetrics:
    enabled: true
    image:
      repository: ghcr.io/victoriametrics/mcp-victoriametrics
      tag: latest
      pullPolicy: IfNotPresent
    port: 8088
    # When empty, defaults to http://<fullname>-victoria-metrics:<service.metricsPort>
    entrypoint: ""
    instanceType: single
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

  victoriaLogs:
    enabled: true
    image:
      repository: ghcr.io/victoriametrics/mcp-victorialogs
      tag: latest
      pullPolicy: IfNotPresent
    port: 8083
    # When empty, defaults to http://<fullname>-victoria-logs:<service.logsPort>
    entrypoint: ""
    readOnly: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

  victoriaTraces:
    enabled: true
    image:
      repository: ghcr.io/victoriametrics-community/mcp-victoriatraces
      tag: latest
      pullPolicy: IfNotPresent
    port: 8082
    # When empty, defaults to http://<fullname>-victoria-traces:<service.tracesPort>
    entrypoint: ""
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

  grafana:
    enabled: true
    image:
      repository: grafana/mcp-grafana
      tag: "latest@sha256:71a3f4e6f412d253611314233df709ec2571fb50e39742d23fa2940f670646dc"
      pullPolicy: IfNotPresent
    port: 8000
    basePath: "/v1/grafana"
    disableWrite: true
    disableAdmin: true
    # When empty, defaults to http://<fullname>-grafana:<service.grafanaPort>/
    grafanaUrl: ""
    tokenSecret:
      name: "infra-mcp-auth"
      key: "grafana-service-account-token"
      optional: true
    extraAllowedHosts: []
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

# ------------------------------------------------------------------------------
# Traefik IngressRoutes and Middlewares
# Exposes shared observability routes (/mcp/v1/*, /ingest/*, /api/v1/*, and root)
# ------------------------------------------------------------------------------
traefik:
  ingressRoute:
    enabled: false
    entryPoints:
      - websecure
    # When empty, defaults to observability.<domain>
    host: ""
    extraHosts: []
    priorities:
      ingest: 1000
      query: 1100
      mcpGrafana: 1200
      mcpMetrics: 1200
      mcpLogs: 1200
      mcpTraces: 1200
      grafana: 1
    tls:
      enabled: true
      secretName: "shared-observability-tls"
    # Target service for /ingest/metrics/api/v1/write, /ingest/logs/, /ingest/otlp/
    ingestService:
      name: "observability-ingest-auth"
      port: 8427
      namespace: ""
    # Target service for /api/v1/query and /api/v1/query_range
    queryService:
      name: ""
      port: 0
      namespace: ""
    middleware:
      ingestPrefix: ""
      stripMcpPrefix: ""
      metricsPrefix: ""
      logsPrefix: ""
      tracesPrefix: ""

# Workload autoscaling (helpers: templates/_autoscaling.tpl, canonical in
# oci/charts/library/workload-autoscaling). VPA renders only where the VPA API exists.
vpa:
  enabled: true
  updateMode: InPlaceOrRecreate
  minReplicas: 1
  controlledValues: RequestsAndLimits
  minAllowed:
    cpu: 10m
    memory: 32Mi
  maxAllowed:
    cpu: "1"
    memory: 1Gi
# HPA template, disabled by default. When enabled with CPU/memory targets the VPA
# switches to recommendations only (updateMode Off) and `replicas` is omitted.
hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
