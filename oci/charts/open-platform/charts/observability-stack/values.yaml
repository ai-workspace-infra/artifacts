replicaCount: 1
serviceAccountName: default
serviceAccount:
  create: false
rbac:
  create: true

domain: "open-platform.local"

victoriaMetrics:
  image:
    repository: victoriametrics/victoria-metrics
    tag: "v1.101.0@sha256:91d0456cc064e195869175074ced2a6849d72531613b320492698e5fe935d10a"
    pullPolicy: IfNotPresent
  port: 8428
  retentionPeriod: "30d"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi

victoriaLogs:
  image:
    repository: victoriametrics/victoria-logs
    tag: "v1.52.0@sha256:47b820890d64c4575a2a0a46415dcd8a4fd59a0f1fcd6a377693d7aea639442e"
    pullPolicy: IfNotPresent
  port: 9428
  retentionPeriod: "1y"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi

victoriaTraces:
  image:
    repository: victoriametrics/victoria-traces
    tag: "v0.1.0@sha256:b3204fd598b023b4726f38689791c707803b9f34733822dd053f22d64721b3d2"
    pullPolicy: IfNotPresent
  port: 10428
  otlpHttpPort: 4318
  otlpGrpcPort: 4317
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 128Mi

otelCollector:
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.114.0@sha256:37fa87091cfaaec7234a27e4e395a40c31c2bfaea97a349a4afef6d9e9681197"
    pullPolicy: IfNotPresent
  port: 4319
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 192Mi

blackboxExporter:
  enabled: false
  image:
    repository: quay.io/prometheus/blackbox-exporter
    tag: v0.25.0
    pullPolicy: IfNotPresent
  port: 9115
  modules:
    http_2xx:
      prober: http
      timeout: 5s
      http:
        preferred_ip_protocol: ip4
        follow_redirects: true
    tcp_tls:
      prober: tcp
      timeout: 5s
      tcp:
        tls: true
        preferred_ip_protocol: ip4
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

grafana:
  # Set false when Grafana runs as its own release (open-platform/charts/grafana).
  enabled: true
  image:
    repository: grafana/grafana
    tag: "13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f"
    pullPolicy: IfNotPresent
  port: 3000
  existingSecret: grafana-admin
  adminPasswordKey: password
  rootUrl: ""
  plugins: []
  dashboardsConfigMap: ""
  datasourcesConfigMap: ""
  appsConfigMap: ""
  runtimeSecret: ""
  bundleChecksum: ""
  dashboardProviders: []
  unsignedPlugins: []
  pluginArchives: []
  pluginInstallerImage: python:3.14.0-alpine3.22@sha256:8373231e1e906ddfb457748bfc032c4c06ada8c759b7b62d9c73ec2a3c56e710
  pluginInstallerResources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

service:
  type: ClusterIP
  grafanaPort: 3000
  metricsPort: 8428
  logsPort: 9428
  tracesPort: 10428
  otlpHttpPort: 4318
  otlpGrpcPort: 4317
  otelCollectorPort: 4319

persistence:
  enabled: true
  size: 20Gi
  accessMode: ReadWriteOnce
  storageClass: ""

telemetry:
  spanMetrics: false
  cluster: ""
  environment: unspecified
  extraScrapeConfigs: []
  kubernetes:
    enabled: false
    # Exclude container when a canonical raw cAdvisor scrape owns container_* series.
    metricGroups: [node, pod, container, volume]
    kubeletInsecureSkipVerify: false
    clusterReceiver: true
    logs:
      enabled: true
      podsLogPath: /var/log/pods
    journald:
      enabled: false
      directory: /var/log/journal
      units:
        - k3s.service
        - k3s-agent.service

# ------------------------------------------------------------------------------
# Traefik IngressRoutes and Middlewares
# Exposes shared observability routes (/ingest/*, /api/v1/*, and root). MCP is served only by the
# platform-mcp chart behind its authenticated gateway, never from here.
# ------------------------------------------------------------------------------
traefik:
  ingressRoute:
    enabled: false
    entryPoints:
      - websecure
    # When empty, defaults to observability.<domain>
    host: ""
    extraHosts: []
    priorities:
      ingest: 1000
      query: 1100
      grafana: 1
    tls:
      enabled: true
      secretName: "shared-observability-tls"
    # Target service for /ingest/metrics/api/v1/write, /ingest/logs/, /ingest/otlp/
    ingestService:
      name: "observability-ingest-auth"
      port: 8427
      namespace: ""
    # Target service for /api/v1/query and /api/v1/query_range
    queryService:
      name: ""
      port: 0
      namespace: ""
    middleware:
      ingestPrefix: ""

# Workload autoscaling (helpers: templates/_autoscaling.tpl, canonical in
# oci/charts/library/workload-autoscaling). VPA renders only where the VPA API exists.
vpa:
  enabled: true
  updateMode: InPlaceOrRecreate
  minReplicas: 1
  controlledValues: RequestsAndLimits
  minAllowed:
    cpu: 10m
    memory: 32Mi
  maxAllowed:
    cpu: "1"
    memory: 1Gi
# HPA template, disabled by default. When enabled with CPU/memory targets the VPA
# switches to recommendations only (updateMode Off) and `replicas` is omitted.
hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Compatibility composition (formerly the standalone oci/charts/observability chart, OCI
# name `observability`): Flux HelmReleases for upstream components plus native Vector and
# process-exporter. Off by default, so the canonical stack render is unchanged. New features
# belong in the canonical stack/agent, not here (docs/observability-chart-convergence.md).
compat:
  enabled: false
  # Former infra-platform/charts/observability scaffold (placeholder Deployment+Service).
  # Independent of compat.enabled; off by default.
  infraPlatformScaffold:
    enabled: false
    image:
      repository: my-repo/observability
      tag: "latest"
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      port: 80
  namespaces:
    observability: observability

  server:
    prometheus:
      enabled: true
      releaseName: prometheus
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      chart:
        name: prometheus
        version: ">=25.0.0 <26.0.0"
      values:
        server:
          persistentVolume:
            enabled: true
            size: 20Gi
        prometheus-node-exporter:
          enabled: false
    victoriaMetrics:
      enabled: true
      releaseName: victoria-metrics
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
        namespace: flux-system
      chart:
        name: victoria-metrics-single
        version: ">=0.13.0 <1.0.0"
      values:
        server:
          persistentVolume:
            enabled: true
            size: 50Gi
    victoriaLogs:
      enabled: true
      releaseName: victoria-logs
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
        namespace: flux-system
      chart:
        name: victoria-logs-single
        version: ">=0.9.0 <1.0.0"
      values:
        server:
          persistentVolume:
            enabled: true
            size: 50Gi
    victoriaTraces:
      enabled: true
      releaseName: victoria-traces
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
        namespace: flux-system
      chart:
        name: victoria-traces-single
        version: ">=0.0.1 <1.0.0"
      values: {}
    grafana:
      enabled: false
      releaseName: grafana
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      chart:
        name: grafana
        version: ">=8.0.0 <9.0.0"
      values:
        initChownData:
          enabled: false
        podSecurityContext:
          fsGroup: 472
        securityContext:
          runAsUser: 472
          runAsGroup: 472
        persistence:
          enabled: true
          size: 10Gi
    otelConnector:
      enabled: false
      releaseName: otel-connector
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
        namespace: flux-system
      chart:
        name: opentelemetry-collector
        version: ">=0.104.0 <1.0.0"
      values:
        image:
          repository: otel/opentelemetry-collector-contrib
        mode: deployment
        config:
          receivers:
            otlp:
              protocols:
                grpc: {}
                http: {}
          processors:
            batch: {}
          exporters:
            debug: {}
          service:
            pipelines:
              traces:
                receivers: [otlp]
                processors: [batch]
                exporters: [debug]
              metrics:
                receivers: [otlp]
                processors: [batch]
                exporters: [debug]
              logs:
                receivers: [otlp]
                processors: [batch]
                exporters: [debug]

  agent:
    nodeExporter:
      enabled: true
      releaseName: node-exporter
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      chart:
        name: prometheus-node-exporter
        version: ">=4.30.0 <5.0.0"
      values: {}
    vector:
      enabled: true
      image:
        repository: timberio/vector
        tag: "0.36.0-distroless-libc"
        pullPolicy: IfNotPresent
      serviceAccountName: vector-agent
      vlogsEndpoint: http://victoria-logs-victoria-logs-single-server.observability.svc.cluster.local:9428
      config: |
        data_dir: /vector-data-dir

        sources:
          journald:
            type: journald

        transforms:
          normalize:
            type: remap
            inputs: ["journald"]
            source: |
              .cluster = "k3s"
              .origin = "vector-agent"

        sinks:
          vlogs:
            type: elasticsearch
            inputs: ["normalize"]
            endpoints:
              - http://victoria-logs-victoria-logs-single-server.observability.svc.cluster.local:9428/insert/elasticsearch/
            mode: bulk
            compression: gzip
      resources:
        limits:
          cpu: 300m
          memory: 512Mi
        requests:
          cpu: 100m
          memory: 128Mi
      volume:
        enabled: true
        name: vector-data-dir
        mountPath: /vector-data-dir
        sizeLimit: 1Gi
    processExporter:
      enabled: true
      image:
        repository: ncabatoff/process-exporter
        tag: v0.8.3
        pullPolicy: IfNotPresent
      serviceAccountName: process-exporter
      port: 9256
      config: |
        process_names:
          - name: "{{.Comm}}"
            cmdline:
              - '.+'
      resources:
        limits:
          cpu: 100m
          memory: 128Mi
        requests:
          cpu: 25m
          memory: 64Mi

  extraObjects: []
