{{- if .Values.gateway.enabled }}
{{- $g := .Values.gateway }}
{{- $ctx := dict "root" . "component" $g.name }}
{{- $config := include "platform-mcp.gatewayConfig" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $g.name }}-config
  labels:
    {{- include "platform-mcp.labels" $ctx | nindent 4 }}
data:
  config.json: |
    {{- $config | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $g.name }}
  labels:
    {{- include "platform-mcp.labels" $ctx | nindent 4 }}
spec:
  {{- include "platform-mcp.replicas" . | nindent 2 }}
  # No unavailability: a new pod that cannot start (e.g. the token Secret has not synced yet)
  # leaves the old pod serving.
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      {{- include "platform-mcp.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      annotations:
        # Restart on backend list changes so the gateway reloads them.
        checksum/config: {{ $config | sha256sum }}
      labels:
        {{- include "platform-mcp.labels" $ctx | nindent 8 }}
        platform.svc.plus/mcp-role: gateway
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ $g.name }}
          image: "{{ $g.image.repository }}:{{ $g.image.tag }}"
          imagePullPolicy: {{ $g.image.pullPolicy }}
          args: ["-config", "/etc/infrastructure-mcp-server/config.json", "-listen", {{ printf ":%d" (int $g.port) | quote }}]
          env:
            {{- range $k, $v := $g.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- /* Inbound auth and outbound auth to the backends (bearer_token_env). */}}
            {{- include "platform-mcp.tokenEnv" (dict "root" . "env" "MCP_SERVICE_TOKEN") | trim | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ $g.port }}
              protocol: TCP
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml $g.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/infrastructure-mcp-server
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ $g.name }}-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $g.name }}
  labels:
    {{- include "platform-mcp.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "platform-mcp.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: {{ $g.port }}
      targetPort: http
      protocol: TCP
{{- if $g.ingress.enabled }}
---
# Only the gateway is exposed; every backend MCP server stays cluster-internal.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $g.name }}
  labels:
    {{- include "platform-mcp.labels" $ctx | nindent 4 }}
spec:
  ingressClassName: {{ $g.ingress.className }}
  rules:
    {{- range $h := $g.ingress.hosts }}
    - host: {{ $h | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $g.name }}
                port:
                  number: {{ $g.port }}
    {{- end }}
{{- end }}
{{- end }}
