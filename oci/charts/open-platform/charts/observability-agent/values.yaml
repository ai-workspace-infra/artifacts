domain: "open-platform.local"

nodeExporter:
  enabled: true
  hostMetrics: false
  hostNetwork: false
  listenOnNodeIP: false
  listenAddress: "0.0.0.0"
  image:
    repository: prom/node-exporter
    tag: "v1.8.2@sha256:4032c6d5bfd752342c3e631c2f1de93ba6b86c41db6b167b9a35372c139e7706"
    pullPolicy: IfNotPresent
  port: 9100

vector:
  enabled: true
  mode: console
  relay:
    sourceBaseUrl: ""
    sourceCluster: ""
    sourceEnvironment: ""
    metricNameRegex: "(kube_.*|kubelet_.*|container_.*|node_.*|namedprocess_.*|up)"
    scrapeIntervalSeconds: 30
    maxSampleAgeSeconds: 60
    remoteWriteUrl: ""
    # Operator must verify remote aliases do not resolve to the source backend.
    distinctBackendAcknowledged: false
    sourceBackendAliases: []
    auth:
      strategy: bearer
      existingSecret: ""
      tokenKey: token
      usernameKey: username
      passwordKey: password
    tls:
      caSecret: ""
      caKey: ca.crt
  image:
    repository: timberio/vector
    tag: "0.41.1-alpine@sha256:501e5403e19238c9073c116fb3cbb750a9201d0271b09dae88f044534803c670"
    pullPolicy: IfNotPresent
  apiPort: 8686

service:
  type: ClusterIP
  nodeExporterPort: 9100
  vectorPort: 8686

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 50m
    memory: 128Mi

nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []
nodeSelector:
  kubernetes.io/os: linux
tolerations:
  - operator: Exists
kubeStateMetrics:
  enabled: false
  image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0@sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b
  port: 8080
  collectors: [nodes, namespaces, pods, deployments, daemonsets, statefulsets, replicasets, services, persistentvolumeclaims, persistentvolumes]
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {cpu: 200m, memory: 256Mi}
processExporter:
  enabled: false
  nameOverride: ""
  fullnameOverride: ""
  image:
    repository: ncabatoff/process-exporter
    tag: "0.8.7"
    digest: sha256:bc2363ff7e05ada1b2a694f06c43dc824dc26cd6e487b5d36b66b1a40df4e842
    pullPolicy: IfNotPresent
  service: {port: 9256}
  serviceAccount: {create: true, name: ""}
  hostProcPath: /proc
  # Health must not trigger synchronous /metrics host-process collection.
  probes:
    startup:
      mode: http
      path: /
      initialDelaySeconds: 0
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 60
    readiness:
      mode: http
      path: /
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    liveness:
      mode: http
      path: /
      initialDelaySeconds: 0
      periodSeconds: 20
      timeoutSeconds: 3
      failureThreshold: 5
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {cpu: 200m, memory: 256Mi}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile: {type: RuntimeDefault}
  processNames:
    - name: "{{.Comm}}"
      cmdline: ['.+']
  networkPolicy:
    enabled: true
    podSelector: {}

# Probe and remote-write components are independently selectable and stay off
# unless an environment's observability-agent HelmRelease enables them.
blackboxExporter:
  enabled: false
  image:
    repository: quay.io/prometheus/blackbox-exporter
    tag: v0.25.0
    digest: sha256:b04a9fef4fa086a02fc7fcd8dcdbc4b7b35cc30cdee860fdc6a19dd8b208d63e
    pullPolicy: IfNotPresent
  port: 9115
  modules: {}
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {cpu: 100m, memory: 128Mi}

vmagent:
  enabled: false
  image:
    repository: victoriametrics/vmagent
    tag: v1.101.0
    digest: sha256:a17f68fe4024cb93eec23bc5ba52a5c45f645f18e2dc929b7743a239b4212bcb
    pullPolicy: IfNotPresent
  port: 8429
  scrapeInterval: 30s
  scrapeTimeout: 10s
  externalLabels: {}
  scrapeConfigs: []
  remoteWrite:
    url: ""
    secretName: ""
    usernameKey: username
    passwordKey: password
    tlsServerName: ""
    maxDiskUsagePerURL: 1Gi
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {cpu: 300m, memory: 256Mi}
  bufferSizeLimit: 1Gi

# Workload autoscaling (helpers: templates/_autoscaling.tpl, canonical in
# oci/charts/library/workload-autoscaling). VPA renders only where the VPA API exists.
vpa:
  enabled: true
  updateMode: InPlaceOrRecreate
  minReplicas: 1
  controlledValues: RequestsAndLimits
  minAllowed:
    cpu: 10m
    memory: 32Mi
  maxAllowed:
    cpu: "1"
    memory: 1Gi
# HPA template, disabled by default. When enabled with CPU/memory targets the VPA
# switches to recommendations only (updateMode Off) and `replicas` is omitted.
hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
