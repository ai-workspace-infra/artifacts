{{- if .Values.processExporter.enabled }}
{{- if .Values.processExporter.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "process-exporter.fullname" . }}
spec:
  podSelector:
    matchLabels:
      {{- include "process-exporter.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            {{- toYaml .Values.processExporter.networkPolicy.podSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: {{ .Values.processExporter.service.port }}
  egress: []
{{- end }}

{{- end }}
