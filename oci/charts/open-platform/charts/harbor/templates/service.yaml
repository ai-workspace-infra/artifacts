apiVersion: v1
kind: Service
metadata:
  name: {{ include "harbor.fullname" . }}
  labels:
    {{- include "harbor.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: portal
      port: {{ .Values.service.portalPort }}
      targetPort: portal
      protocol: TCP
    - name: api
      port: {{ .Values.service.port }}
      targetPort: portal
      protocol: TCP
  selector:
    {{- include "harbor.selectorLabels" . | nindent 4 }}
