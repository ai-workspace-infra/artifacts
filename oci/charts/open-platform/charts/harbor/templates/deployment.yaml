apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "harbor.fullname" . }}
  labels:
    {{- include "harbor.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "harbor.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "harbor.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: harbor-portal
          image: "{{ .Values.portal.image.repository }}:{{ .Values.portal.image.tag }}"
          imagePullPolicy: {{ .Values.portal.image.pullPolicy }}
          ports:
            - name: portal
              containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: portal
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: portal
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: harbor-data
              mountPath: /data
      volumes:
        - name: harbor-data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "harbor.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
