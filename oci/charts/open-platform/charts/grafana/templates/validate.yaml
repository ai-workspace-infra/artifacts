{{- range .Values.plugins }}
{{- if not (regexMatch "^[a-zA-Z0-9_-]+@[0-9]+[.][0-9]+[.][0-9]+$" .) }}
{{- fail "grafana.plugins must pin signed catalog plugins as id@version; custom archives use pluginArchives" }}
{{- end }}
{{- end }}
{{- range .Values.unsignedPlugins }}
{{- if not (regexMatch "^[a-zA-Z0-9_-]+$" .) }}
{{- fail "grafana.unsignedPlugins requires exact plugin IDs (no wildcard)" }}
{{- end }}
{{- end }}
{{- range .Values.dashboardProviders }}
{{- if not (regexMatch "^[a-z0-9-]+$" .path) }}
{{- fail "grafana.dashboardProviders.path must be a single safe directory name" }}
{{- end }}
{{- if not .configMaps }}
{{- fail "grafana.dashboardProviders requires configMaps" }}
{{- end }}
{{- end }}

{{- if and .Values.pluginArchives (not (regexMatch "@sha256:[a-f0-9]{64}$" .Values.pluginInstallerImage)) }}
{{- fail "grafana.pluginInstallerImage requires an immutable digest" }}
{{- end }}
{{- range .Values.pluginArchives }}
{{- if or (not (regexMatch "^[a-zA-Z0-9_-]+$" .id)) (not (regexMatch "^[a-f0-9]{64}$" .sha256)) (not (hasPrefix "https://" .url)) }}
{{- fail "grafana.pluginArchives requires exact id, HTTPS URL and SHA256" }}
{{- end }}
{{- end }}
{{- range .Values.disablePlugins }}
{{- if has . (list "prometheus" "jaeger" "victoriametrics-logs-datasource") }}
{{- fail (printf "disablePlugins must not disable %s: the platform data sources need it" .) }}
{{- end }}
{{- end }}
