domain: "open-platform.local"

newApi:
  image:
    repository: calciumion/new-api
    tag: "v0.4.10"
    pullPolicy: IfNotPresent
  port: 3000

litellm:
  image:
    repository: ghcr.io/berriai/litellm
    tag: "v1.51.0"
    pullPolicy: IfNotPresent
  port: 4000
  masterKey: "sk-litellm-master-key-2026"

service:
  type: ClusterIP

# Workload autoscaling (helpers: templates/_autoscaling.tpl, canonical in
# oci/charts/library/workload-autoscaling). VPA renders only where the VPA API exists.
vpa:
  enabled: true
  updateMode: InPlaceOrRecreate
  minReplicas: 1
  controlledValues: RequestsAndLimits
  minAllowed:
    cpu: 10m
    memory: 32Mi
  maxAllowed:
    cpu: "1"
    memory: 1Gi
# HPA template, disabled by default. When enabled with CPU/memory targets the VPA
# switches to recommendations only (updateMode Off) and `replicas` is omitted.
hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
