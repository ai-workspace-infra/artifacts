domain: "open-platform.local"

vault:
  image:
    repository: hashicorp/vault
    tag: "1.17.6"
    pullPolicy: IfNotPresent
  port: 8200
  apiAddr: ""
  devRootToken: "root-token-dev"

zitadelDb:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  port: 5432
  dbName: "zitadel"
  user: "zitadel"
  password: "ZitadelPassword2026!"

# Zitadel server (merged from the former infra-platform/charts/zitadel scaffold).
# Off by default; the image is the scaffold placeholder and must be set before enabling.
zitadel:
  enabled: false
  image:
    repository: my-repo/zitadel
    tag: "latest"
    pullPolicy: IfNotPresent
  port: 80

service:
  type: ClusterIP

persistence:
  enabled: true
  size: 10Gi
  accessMode: ReadWriteOnce
  storageClass: ""

# Workload autoscaling (helpers: templates/_autoscaling.tpl, canonical in
# oci/charts/library/workload-autoscaling). VPA renders only where the VPA API exists.
vpa:
  enabled: true
  updateMode: InPlaceOrRecreate
  minReplicas: 1
  controlledValues: RequestsAndLimits
  minAllowed:
    cpu: 10m
    memory: 32Mi
  maxAllowed:
    cpu: "1"
    memory: 1Gi
# HPA template, disabled by default. When enabled with CPU/memory targets the VPA
# switches to recommendations only (updateMode Off) and `replicas` is omitted.
hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
