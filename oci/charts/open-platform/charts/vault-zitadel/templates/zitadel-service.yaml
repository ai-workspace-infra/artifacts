{{- if and .Values.zitadel .Values.zitadel.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vault-zitadel.fullname" . }}-zitadel
  labels:
    {{- include "vault-zitadel.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.zitadel.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "vault-zitadel.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/subcomponent: zitadel
{{- end }}
