replicaCount: 1
image:
  repository: pgsty/silo
  tag: "RELEASE.2026-10-18T00-00-00Z"
  pullPolicy: IfNotPresent

domain: "open-platform.local"
rootUser: "silo_admin"
rootPassword: "SiloAdminPassword2026!"

service:
  type: ClusterIP
  apiPort: 9000
  consolePort: 9001

persistence:
  enabled: true
  size: 20Gi
  accessMode: ReadWriteOnce
  storageClass: ""

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 100m
    memory: 256Mi

# Workload autoscaling (helpers: templates/_autoscaling.tpl, canonical in
# oci/charts/library/workload-autoscaling). VPA renders only where the VPA API exists.
vpa:
  enabled: true
  updateMode: InPlaceOrRecreate
  minReplicas: 1
  controlledValues: RequestsAndLimits
  minAllowed:
    cpu: 10m
    memory: 32Mi
  maxAllowed:
    cpu: "1"
    memory: 1Gi
# HPA template, disabled by default. When enabled with CPU/memory targets the VPA
# switches to recommendations only (updateMode Off) and `replicas` is omitted.
hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
