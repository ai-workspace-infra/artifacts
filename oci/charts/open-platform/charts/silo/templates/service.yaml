apiVersion: v1
kind: Service
metadata:
  name: {{ include "silo.fullname" . }}
  labels:
    {{- include "silo.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: s3-api
      port: {{ .Values.service.apiPort }}
      targetPort: s3-api
      protocol: TCP
    - name: console
      port: {{ .Values.service.consolePort }}
      targetPort: console
      protocol: TCP
  selector:
    {{- include "silo.selectorLabels" . | nindent 4 }}
