# Intentional 0.2 contract break: no legacy components/database/ingress keys.
global:
  environment: local
  expectedNamespace: ""
  imagePullSecrets: []
  podLabels: {}
console:
  enabled: false
accounts:
  enabled: false
billing:
  enabled: false
content:
  enabled: false
edgeGateway:
  enabled: false
postgresql:
  enabled: false
caddy:
  enabled: false
  metrics:
    prometheus:
      enabled: false
stunnelClient:
  enabled: false
stunnelServer:
  enabled: false

# Traefik ingress controller (mutually exclusive with caddy when acting as cluster ingress)
traefik:
  enabled: false

# The metrics endpoint is supplied by the environment's GitOps declaration.
flagger:
  enabled: false
  meshProvider: traefik
  metricsServer: ""
  prometheus:
    install: false
  crd:
    create: false
