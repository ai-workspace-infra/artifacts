{{- if eq .Values.global.environment "prod" }}
{{- if or (not .Values.global.expectedNamespace) (eq .Release.Namespace "default") (ne .Release.Namespace .Values.global.expectedNamespace) }}{{ fail "production requires an explicit matching global.expectedNamespace and non-default release namespace" }}{{ end }}
{{- if and .Values.caddy.enabled .Values.caddy.httpOnly }}{{ fail "production Caddy requires HTTPS with existing TLS Secrets" }}{{ end }}
{{- range $name := list "accounts" "billing" "content" }}
{{- $config := index $.Values $name }}
{{- if and $config.enabled (not $config.workload.secretRefs) }}{{ fail (printf "production %s requires existing runtime Secret references" $name) }}{{ end }}
{{- end }}
{{- end }}
{{- if .Values.caddy.enabled }}
{{- if not .Values.console.enabled }}{{ fail "Caddy requires console.enabled" }}{{ end }}
{{- $expected := ternary "console" "frontend-router" (eq .Values.console.deploymentProfile "single-container") }}
{{- if ne .Values.caddy.frontendService $expected }}{{ fail (printf "caddy.frontendService must be %s for the selected console profile" $expected) }}{{ end }}
{{- if ne .Values.caddy.gatewayEnabled .Values.edgeGateway.enabled }}{{ fail "caddy.gatewayEnabled must match edgeGateway.enabled" }}{{ end }}
{{- if not .Values.accounts.enabled }}{{ fail "Caddy API routing requires accounts.enabled" }}{{ end }}
{{- if and .Values.caddy.routes.billingHost (not .Values.billing.enabled) }}{{ fail "billing host requires billing.enabled" }}{{ end }}
{{- end }}
