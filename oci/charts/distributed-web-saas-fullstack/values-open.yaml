# Local Kubernetes example. Supply reviewed digest-pinned images in a separate
# values overlay; the empty image defaults deliberately prevent installation.
# This profile is HTTP-only for *.localhost and must never be used for PROD.
global:
  environment: local
console:
  enabled: true
  deploymentProfile: independent
accounts:
  enabled: true
  workload:
    secretRefs: [example-runtime]
billing:
  enabled: true
  workload:
    secretRefs: [example-runtime]
content:
  enabled: true
  workload:
    secretRefs: [example-runtime]
edgeGateway:
  enabled: true
  boundaries:
    auth:
      secretRefs: [example-gateway-runtime]
    admin:
      secretRefs: [example-gateway-runtime]
    core:
      secretRefs: [example-gateway-runtime]
postgresql:
  enabled: true
  existingSecret: example-database
  storage:
    className: local-path
caddy:
  enabled: true
  httpOnly: true
  frontendService: frontend-router
  gatewayEnabled: true
  routes:
    consoleHost: console.localhost
    accountsHost: accounts.localhost
    billingHost: billing.localhost
stunnel:
  enabled: false
