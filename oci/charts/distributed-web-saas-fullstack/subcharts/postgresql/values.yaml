enabled: false
global:
  imagePullSecrets: []
  podLabels: {}
podAnnotations: {}
podSecurityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}
volumes: []
networkPolicy:
  enabled: true
image: ''
username: app
database: app
existingSecret: ''
secretKey: password
identityAccounts:
  # Credentials are synchronized from the configured Vault identity records by ESO.
  # This chart only consumes Kubernetes Secrets; it never authenticates to Vault.
  enabled: false
  root:
    username: root
    existingSecret: postgresql-admin
    secretKey: password
  operator:
    username: operator
    existingSecret: postgresql-operator
    secretKey: password
    tables: []
    sequences: []
  auditor:
    username: auditor
    existingSecret: postgresql-auditor
    secretKey: password
    views: []
storage:
  className: ''
  size: 10Gi
  existingClaim: ''
  mountPath: /var/lib/postgresql/data
  pgdata: /var/lib/postgresql/data/pgdata
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: '1'
    memory: 1Gi
metrics:
  enabled: false
  username: ''
  existingSecret: ''
  secretKey: password
  image: 'quay.io/prometheuscommunity/postgres-exporter@sha256:386b12d19eab2a37d7cd8ca8b4c7491cc7a830d9581f49af6c98a393da9605e6'
  port: 9187
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 65534
    capabilities:
      drop:
        - ALL
  service:
    port: 9187
    annotations:
      prometheus.io/scrape: 'true'
      prometheus.io/port: '9187'
      prometheus.io/path: '/metrics'
  env: []

