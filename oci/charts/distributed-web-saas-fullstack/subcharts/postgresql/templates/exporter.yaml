{{- if and .Values.enabled .Values.metrics.enabled }}
{{- $name := include "websaas.name" (dict "root" . "name" "postgresql") }}
{{- $metricsUser := .Values.username }}
{{- $metricsSecret := .Values.existingSecret }}
{{- $metricsKey := .Values.secretKey }}
{{- if .Values.identityAccounts.enabled }}
{{- $metricsUser = required "postgresql.metrics.username is required when identityAccounts and metrics are enabled" .Values.metrics.username }}
{{- $metricsSecret = required "postgresql.metrics.existingSecret is required when identityAccounts and metrics are enabled; do not use the root credential" .Values.metrics.existingSecret }}
{{- $metricsKey = required "postgresql.metrics.secretKey is required when identityAccounts and metrics are enabled" .Values.metrics.secretKey }}
{{- end }}
{{- $exporterName := printf "%s-exporter" $name }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $exporterName }}
  labels:
    {{- include "websaas.labels" (dict "root" . "name" "postgres-exporter") | nindent 4 }}
  annotations:
    {{- with .Values.metrics.service.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: postgres-exporter
  ports:
    - name: metrics
      port: {{ .Values.metrics.port | default 9187 }}
      targetPort: metrics
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $exporterName }}
  labels:
    {{- include "websaas.labels" (dict "root" . "name" "postgres-exporter") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: postgres-exporter
  template:
    metadata:
      labels:
        {{- include "websaas.labels" (dict "root" . "name" "postgres-exporter") | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.metrics.port | default 9187 | quote }}
        prometheus.io/path: "/metrics"
    spec:
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{ toJson . }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toJson . }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{ toJson . }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres-exporter
          securityContext:
            {{- toYaml .Values.metrics.securityContext | nindent 12 }}
          image: {{ include "websaas.image" .Values.metrics.image | quote }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port | default 9187 }}
              protocol: TCP
          env:
            - name: DATA_SOURCE_URI
              value: "{{ $name }}:5432/{{ .Values.database }}?sslmode=disable"
            - name: DATA_SOURCE_USER
              value: {{ $metricsUser | quote }}
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ required "postgresql metrics credentials are required" $metricsSecret }}
                  key: {{ $metricsKey }}
            {{- with .Values.metrics.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.metrics.resources | nindent 12 }}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $exporterName }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: postgres-exporter
  policyTypes: [Ingress]
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.metrics.port | default 9187 }}
{{- end }}
{{- end }}
