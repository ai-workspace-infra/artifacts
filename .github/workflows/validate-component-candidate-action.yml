name: Validate component candidate Action

on:
  pull_request:
    paths:
      - .github/actions/component-candidate/**
      - .github/workflows/validate-component-candidate-action.yml

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Validate Python and contract tests
        run: python3 .github/actions/component-candidate/test_component_candidate.py
