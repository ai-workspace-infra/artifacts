name: Reusable Linode Packer Golden Image Publish

on:
  workflow_call:
    inputs:
      template:
        required: true
        type: string
      source_name:
        required: true
        type: string
      linode_region:
        required: false
        default: ap-northeast
        type: string
      linode_instance_type:
        required: false
        default: g6-standard-2
        type: string
      vault_kv_path:
        required: false
        default: kv/data/CICD/uat
        type: string
      runner:
        required: false
        default: ubuntu-latest
        type: string

jobs:
  publish:
    name: Publish ${{ inputs.source_name }} to Linode
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-packer@v3
        with:
          version: latest
      - name: Get Vault Secrets
        uses: hashicorp/vault-action@v3
        with:
          url: https://vault.svc.plus
          method: jwt
          path: jwt
          role: github-actions-artifacts-uat
          jwtGithubAudience: vault
          secrets: |
            ${{ inputs.vault_kv_path }} LINODE_TOKEN | LINODE_TOKEN
      - name: Packer Build (Linode)
        run: |
          packer init "${{ inputs.template }}"
          packer validate -var="linode_region=${{ inputs.linode_region }}" -var="linode_instance_type=${{ inputs.linode_instance_type }}" "${{ inputs.template }}"
          packer build -color=false -only="linode.${{ inputs.source_name }}" \
            -var="linode_region=${{ inputs.linode_region }}" \
            -var="linode_instance_type=${{ inputs.linode_instance_type }}" \
            "${{ inputs.template }}"
