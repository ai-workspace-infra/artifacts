name: Sync Images for Observability Stack (5 Deployments)

on:
  schedule:
    - cron: "0 1 * * *"
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-images-observability-stack.yml'
      - 'oci/charts/open-platform/charts/observability-stack/values.yaml'
  workflow_dispatch:
    inputs:
      runner:
        description: Runner to execute on
        required: true
        default: ubuntu-latest
        type: choice
        options:
          - ubuntu-latest
          - self-runner

permissions:
  contents: read
  packages: write

jobs:
  grafana:
    name: Save Grafana Deployment Image
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and push Grafana image
        run: |
          set -euo pipefail
          SRC="docker.io/grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f"
          DST="ghcr.io/${{ github.repository_owner }}/observability-grafana:13.2.4"
          docker pull "$SRC"
          docker tag "$SRC" "$DST"
          docker push "$DST"

  victoria-metrics:
    name: Save VictoriaMetrics Deployment Image
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and push VictoriaMetrics image
        run: |
          set -euo pipefail
          SRC="docker.io/victoriametrics/victoria-metrics:v1.101.0@sha256:91d0456cc064e195869175074ced2a6849d72531613b320492698e5fe935d10a"
          DST="ghcr.io/${{ github.repository_owner }}/observability-victoria-metrics:v1.101.0"
          docker pull "$SRC"
          docker tag "$SRC" "$DST"
          docker push "$DST"

  victoria-logs:
    name: Save VictoriaLogs Deployment Image
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and push VictoriaLogs image
        run: |
          set -euo pipefail
          SRC="docker.io/victoriametrics/victoria-logs:v1.52.0@sha256:47b820890d64c4575a2a0a46415dcd8a4fd59a0f1fcd6a377693d7aea639442e"
          DST="ghcr.io/${{ github.repository_owner }}/observability-victoria-logs:v1.52.0"
          docker pull "$SRC"
          docker tag "$SRC" "$DST"
          docker push "$DST"

  victoria-traces:
    name: Save VictoriaTraces Deployment Image
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and push VictoriaTraces image
        run: |
          set -euo pipefail
          SRC="docker.io/victoriametrics/victoria-traces:v0.1.0@sha256:b3204fd598b023b4726f38689791c707803b9f34733822dd053f22d64721b3d2"
          DST="ghcr.io/${{ github.repository_owner }}/observability-victoria-traces:v0.1.0"
          docker pull "$SRC"
          docker tag "$SRC" "$DST"
          docker push "$DST"

  otel-collector:
    name: Save OTel Collector Deployment Image
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and push OTel Collector image
        run: |
          set -euo pipefail
          SRC="docker.io/otel/opentelemetry-collector-contrib:0.114.0@sha256:37fa87091cfaaec7234a27e4e395a40c31c2bfaea97a349a4afef6d9e9681197"
          DST="ghcr.io/${{ github.repository_owner }}/observability-otel-collector:0.114.0"
          docker pull "$SRC"
          docker tag "$SRC" "$DST"
          docker push "$DST"
