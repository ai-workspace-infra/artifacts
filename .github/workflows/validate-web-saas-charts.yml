name: validate-web-saas-charts
on:
  pull_request:
    paths:
      - 'oci/charts/web-saas-fullstack/**'
      - 'oci/charts/open-platform/**'
      - '.github/scripts/*web-saas-*.sh'
      - '.github/tests/test_observability_agent_chart.py'
      - '.github/tests/test_web_saas_charts.py'
      - '.github/tests/test_web_saas_independent_releases.py'
      - '.github/tests/test_otel_spanmetrics_runtime.py'
      - '.github/tests/test_grafana_config_render.py'
      - '.github/tests/requirements-charts.txt'
      - '.github/workflows/validate-web-saas-charts.yml'
      - '.github/workflows/release-oci-charts.yml'
      - '.github/scripts/release-oci-charts.sh'
permissions:
  contents: read
jobs:
  render-and-package:
    runs-on: ubuntu-latest
    env:
      WEBSAAS_VALIDATE_CADDY: "1"
      WEBSAAS_RENDER_DIR: /tmp/websaas-rendered-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with:
          version: v3.15.4
      - name: Validate profiles, rejection cases and packaged dependencies
        run: .github/scripts/check-web-saas-charts.sh
      - name: Validate independent releases from one chart package
        run: python3 .github/tests/test_web_saas_independent_releases.py
      - name: Validate standalone observability agent security and producers
        run: OBS_AGENT_RUNTIME_TESTS=1 python3 .github/tests/test_observability_agent_chart.py
      - name: Validate rendered Kubernetes API schemas
        run: .github/scripts/check-web-saas-schemas.sh
      - name: Validate observability chart and secret references
        run: |
          helm lint oci/charts/open-platform/charts/observability-stack
          helm lint oci/charts/open-platform/charts/grafana
          helm template platform-grafana oci/charts/open-platform/charts/grafana >/tmp/grafana-rendered.yaml
          helm template platform-observability oci/charts/open-platform/charts/observability-stack --set grafana.enabled=false >/tmp/observability-no-grafana.yaml
          ! grep -q "component: grafana" /tmp/observability-no-grafana.yaml
          ! grep -q "component: mcp-grafana" /tmp/grafana-rendered.yaml
          helm template platform-grafana oci/charts/open-platform/charts/grafana --set mcp.enabled=true >/tmp/grafana-mcp.yaml
          grep -q "name: grafana-mcp-server" /tmp/grafana-mcp.yaml
          grep -q -- "--disable-write" /tmp/grafana-mcp.yaml
          # Bearer auth is on by default (Secret platform-mcp) and usage stats are off.
          grep -q "MCP_GRAFANA_SERVER_TOKEN" /tmp/grafana-mcp.yaml
          grep -q 'name: "platform-mcp"' /tmp/grafana-mcp.yaml
          grep -q "GRAFANA_USAGE_STATS" /tmp/grafana-mcp.yaml
          grep -q 'GF_ANALYTICS_REPORTING_ENABLED' /tmp/grafana-rendered.yaml
          # Auth on with no Secret must fail to render; explicit opt-out renders without the token.
          ! helm template platform-grafana oci/charts/open-platform/charts/grafana --set mcp.enabled=true --set global.mcp.bearerToken.existingSecret= >/dev/null 2>&1
          ! helm template platform-grafana oci/charts/open-platform/charts/grafana --set mcp.enabled=true --set global.mcp.bearerToken.enabled=false | grep -q "MCP_GRAFANA_SERVER_TOKEN"
          # platform-mcp: each server toggles independently, backends follow the toggles, auth fails closed.
          P=oci/charts/open-platform/charts/platform-mcp
          E="--set victoriametrics.entrypoint=http://vm:8428 --set victorialogs.entrypoint=http://vl:9428 --set victoriatraces.entrypoint=http://vt:10428"
          helm lint $P $E
          helm template p $P $E >/tmp/pmcp.yaml
          for n in infrastructure-mcp-server ssh-mcp-server victoriametrics-mcp-server victorialogs-mcp-server victoriatraces-mcp-server; do grep -q "name: $n$" /tmp/pmcp.yaml; done
          grep -q '"name": "observability-metrics"' /tmp/pmcp.yaml
          helm template p $P $E --set victorialogs.enabled=false --set sshMcpServer.enabled=false >/tmp/pmcp-off.yaml
          ! grep -q "name: victorialogs-mcp-server$" /tmp/pmcp-off.yaml
          ! grep -q '"name": "observability-logs"' /tmp/pmcp-off.yaml
          ! grep -q "name: ssh-mcp-server$" /tmp/pmcp-off.yaml
          ! helm template p $P $E --set global.mcp.bearerToken.existingSecret= >/dev/null 2>&1
          ! helm template p $P $E --set global.mcp.bearerToken.enabled=false >/dev/null 2>&1
          helm template p $P $E --set global.mcp.bearerToken.enabled=false --set sshMcpServer.enabled=false >/tmp/pmcp-noauth.yaml
          ! grep -q "MCP_SERVICE_TOKEN" /tmp/pmcp-noauth.yaml
          ! grep -q "name: auth-proxy" /tmp/pmcp-noauth.yaml
          # Every backend checks the bearer token: VictoriaLogs/Traces MCP via the auth-proxy sidecar.
          test "$(grep -c 'name: auth-proxy$' /tmp/pmcp.yaml)" = 2
          test "$(grep -c '"bearer_token_env": "MCP_SERVICE_TOKEN"' /tmp/pmcp.yaml)" = 4
          grep -q '127.0.0.1:18083' /tmp/pmcp.yaml
          helm template platform-observability oci/charts/open-platform/charts/observability-stack --set telemetry.cluster=validation --set telemetry.environment=prod >/tmp/observability-rendered.yaml
      - name: Verify Grafana external configuration and rejection cases
        run: python3 .github/tests/test_grafana_config_render.py
      - name: Verify OTLP request metrics with legacy resource labels
        run: python3 .github/tests/test_otel_spanmetrics_runtime.py
