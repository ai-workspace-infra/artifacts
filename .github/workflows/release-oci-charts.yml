name: release-oci-charts

on:
  push:
    branches:
      - main
    paths:
      - "oci/charts/open-platform/**"
      - "oci/charts/apps/app-service/**"
      - "oci/charts/postgresql/**"
      - "oci/charts/observability/**"
      - "oci/charts/distributed-web-saas-fullstack/**"
      - ".github/scripts/*web-saas-*.sh"
      - ".github/scripts/release-oci-charts.sh"
      - ".github/tests/test_web_saas_charts.py"
      - ".github/tests/requirements-charts.txt"
      - ".github/workflows/release-oci-charts.yml"
  workflow_dispatch:
    inputs:
      runner:
        description: Runner to execute on
        required: true
        default: ubuntu-latest
        type: choice
        options:
          - ubuntu-latest

permissions:
  contents: read
  packages: write

env:
  GHCR_NAMESPACE: ghcr.io/${{ github.repository_owner }}

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with:
          version: v3.15.4

      - name: Log In To GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate charts and deployment profiles
        run: .github/scripts/release-oci-charts.sh validate

      - name: Package charts and source manifest
        run: .github/scripts/release-oci-charts.sh package

      - name: Push immutable charts to GHCR
        run: .github/scripts/release-oci-charts.sh push

      - name: Preserve package checksums and source identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oci-charts-${{ github.sha }}
          path: ${{ runner.temp }}/oci-charts-${{ github.run_id }}-${{ github.run_attempt }}/
