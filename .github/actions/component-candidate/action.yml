name: Publish one immutable component candidate
description: >-
  Resolve one component source SHA, create its immutable UAT candidate tag,
  associate the exact owner build run, and verify the declared artifact.
inputs:
  component-json:
    description: One validated component object from the pinned GitOps policy.
    required: true
  candidate-id:
    description: Immutable daily-build-* UAT candidate identifier.
    required: true
  source-ref:
    description: Source ref selected by the parent run; defaults to main.
    required: false
    default: main
  owner-sha:
    description: Full SHA of the checked-out Artifacts owner action.
    required: true
  github-app-client-id:
    description: Runtime GitHub App client ID used to mint a repository-scoped token.
    required: true
  github-app-private-key:
    description: Runtime GitHub App private key; never persisted or emitted.
    required: true
  registry-username:
    description: Runtime GHCR read identity used only for OCI verification.
    required: false
    default: ""
  registry-token:
    description: Runtime GHCR read token used only for OCI verification.
    required: false
    default: ""
  timeout-seconds:
    description: Maximum wait for the exact owner build run.
    required: false
    default: "1800"
outputs:
  receipt_path:
    description: Sanitized component receipt path.
    value: ${{ steps.publish.outputs.receipt_path }}
  source_sha:
    description: Resolved immutable component source SHA.
    value: ${{ steps.publish.outputs.source_sha }}
  artifact_digest:
    description: Verified OCI digest when the component publishes an OCI image.
    value: ${{ steps.publish.outputs.artifact_digest }}
  run_id:
    description: Exact owner build run ID.
    value: ${{ steps.publish.outputs.run_id }}
  run_attempt:
    description: Exact owner build run attempt.
    value: ${{ steps.publish.outputs.run_attempt }}
runs:
  using: composite
  steps:
    - id: publish
      name: Publish and verify component candidate
      shell: bash
      env:
        COMPONENT_JSON: ${{ inputs.component-json }}
        CANDIDATE_ID: ${{ inputs.candidate-id }}
        SOURCE_REF: ${{ inputs.source-ref }}
        ARTIFACTS_OWNER_SHA: ${{ inputs.owner-sha }}
        GITHUB_APP_CLIENT_ID: ${{ inputs.github-app-client-id }}
        GITHUB_APP_PRIVATE_KEY: ${{ inputs.github-app-private-key }}
        REGISTRY_USERNAME: ${{ inputs.registry-username }}
        REGISTRY_TOKEN: ${{ inputs.registry-token }}
        OWNER_RUN_TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
      run: node "$GITHUB_ACTION_PATH/index.mjs"

